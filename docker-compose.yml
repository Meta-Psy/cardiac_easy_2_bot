version: '3.8'

services:
  cardio_bot:
    build: .
    container_name: cardio_bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DB_PATH=data/cardio_bot.db
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
      - ./materials:/app/materials
    working_dir: /app
    command: python main.py